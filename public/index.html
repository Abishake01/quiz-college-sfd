<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fdfbf2" />
  <title>Doodle Quiz</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✏️%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Permanent+Marker&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/sketch.css" />
  <link rel="stylesheet" href="/css/play.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">✏️ <span>Doodle Quiz</span></div>
    <div class="topbar-right">
      <span id="whoami" class="badge hidden"></span>
      <button id="muteBtn" class="icon-btn" type="button" aria-label="Toggle sound">🔊</button>
    </div>
  </header>

  <main id="app" class="stage" aria-live="polite"></main>

  <!-- floating background doodles -->
  <div class="bg-doodles" aria-hidden="true">
    <span style="top:12%;left:6%">★</span>
    <span style="top:70%;left:4%">✎</span>
    <span style="top:20%;right:6%">☁</span>
    <span style="top:82%;right:8%">✿</span>
    <span style="top:45%;right:3%">♥</span>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/effects.js"></script>
  <script src="/js/player.js"></script>
</body>
</html>
